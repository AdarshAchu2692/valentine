<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Something for You</title>

<style>
body{
  margin:0;
  background:#f7e0e6;
  font-family:'Segoe UI', Arial, sans-serif;
}

.wrap{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px;
}

.card{
  width:min(1100px,96%);
  background:#ffd1da;
  border-radius:18px;
  padding:36px;
  box-shadow:0 20px 50px rgba(200,90,120,0.15);
}

.title{
  text-align:center;
  margin-bottom:28px;
}

.title h1{
  margin:0;
  font-size:34px;
  color:#6a1a20;
}

.tiles{
  display:flex;
  gap:22px;
  justify-content:space-between;
  flex-wrap:wrap;
}

.tile{
  flex:1 1 30%;
  min-width:220px;
  background:#ffdce3;
  border-radius:14px;
  padding:24px 18px;
  text-align:center;
  box-shadow:0 10px 28px rgba(200,80,100,0.08);
  transition:transform .2s;
  text-decoration:none;
  color:#52272b;
}

.tile:hover{
  transform:translateY(-8px);
}

.video-icon{
  width:90px;
  height:90px;
  border-radius:16px;
  background:#fff;
  margin:0 auto 14px;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

.video-icon video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.tile h3{
  margin:8px 0 4px;
  font-size:16px;
}

.tile p{
  margin:0;
  font-size:13px;
  color:#8b5b62;
}

.center{
  text-align:center;
  margin-top:30px;
}

.finally-btn{
  background:#e71f2f;
  color:white;
  padding:12px 32px;
  border-radius:26px;
  text-decoration:none;
  font-weight:700;
  box-shadow:0 12px 36px rgba(231,60,60,0.25);
}
</style>
</head>

<body>

<div class="wrap">
  <div class="card">

    <div class="title">
      <h1>Something for You</h1>
    </div>

    <div class="tiles">

      <a class="tile" href="gift1.html">
        <div class="video-icon">
          <video autoplay loop muted playsinline>
            <source src="3.mp4" type="video/mp4">
          </video>
        </div>
        <h3>Gift 1</h3>
        <p>A little fun for you</p>
      </a>

      <a class="tile" href="gift2.html">
        <div class="video-icon">
          <video autoplay loop muted playsinline>
            <source src="4.mp4" type="video/mp4">
          </video>
        </div>
        <h3>Gift 2</h3>
        <p>Something from my heart</p>
      </a>

      <a class="tile" href="gift3.html">
        <div class="video-icon">
          <video autoplay loop muted playsinline>
            <source src="6.mp4" type="video/mp4">
          </video>
        </div>
        <h3>Gift 3</h3>
        <p>Our memories</p>
      </a>

    </div>

    <div class="center">
      <a class="finally-btn" href="final.html">FINAL One… ❤️</a>
    </div>

  </div>
</div>

</body>
</html>
